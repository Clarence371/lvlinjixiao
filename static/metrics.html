<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>业务指标 - 绿林工具绩效管理系统</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--brand:#0078D4;--brand-hover:#106EBE;--text-primary:#323130;--text-secondary:#605E5C;--bg-primary:#FFFFFF;--bg-secondary:#F3F2F1;--bg-tertiary:#FAFAFA;--border:#EDEBE9;--border-strong:#D2D0CE;--success:#107C10;--warning:#FF8C00;--error:#D13438;--shadow-sm:0 2px 4px rgba(0,0,0,0.08);--shadow-md:0 4px 12px rgba(0,0,0,0.1);--shadow-lg:0 8px 24px rgba(0,0,0,0.12);}
        body{font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.6;color:var(--text-primary);background:var(--bg-secondary);}
        .page-wrapper{margin-top:60px;padding:32px;}
        .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
        .page-title{font-size:28px;font-weight:600;}
        .card{background:white;border-radius:8px;box-shadow:var(--shadow-sm);padding:24px;margin-bottom:16px;}
        .card-title{font-size:18px;font-weight:600;margin-bottom:16px;}
        .btn{padding:8px 20px;border-radius:4px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all 0.2s;display:inline-flex;align-items:center;gap:6px;font-family:inherit;}
        .btn:active{transform:scale(0.98)}
        .btn-primary{background:var(--brand);color:white}.btn-primary:hover{background:var(--brand-hover)}
        .btn-secondary{background:white;color:var(--text-primary);border:1px solid var(--border-strong)}.btn-secondary:hover{background:var(--bg-secondary)}
        .btn-edit{background:#DEECF9;color:var(--brand);font-size:13px;padding:5px 12px;border-radius:4px;border:none;cursor:pointer;}.btn-edit:hover{background:#C4DEF6}
        .btn-delete{background:#FDE7E9;color:var(--error);font-size:13px;padding:5px 12px;border-radius:4px;border:none;cursor:pointer;}.btn-delete:hover{background:#F1B8BC}
        table{width:100%;border-collapse:collapse;font-size:14px;}
        table th{background:var(--bg-tertiary);padding:12px 16px;text-align:left;font-weight:600;border-bottom:1px solid var(--border);}
        table td{padding:12px 16px;border-bottom:1px solid var(--border);}
        table tr:hover td{background:#F5F9FD}
        .weight-bar{display:inline-flex;align-items:center;gap:8px;}
        .weight-bar .bar{height:8px;background:linear-gradient(90deg,var(--brand),#5B5FCF);border-radius:4px;min-width:40px;}
        .badge{padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;display:inline-block;}
        .badge-q{background:#DEECF9;color:#0078D4}
        .badge-nq{background:#FFF4CE;color:#797643}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity 0.2s;}
        .modal-overlay.show{opacity:1;pointer-events:all}
        .modal{background:white;border-radius:8px;box-shadow:var(--shadow-lg);width:520px;max-height:80vh;overflow:auto;transform:translateY(20px);transition:transform 0.2s;}
        .modal-overlay.show .modal{transform:translateY(0)}
        .modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
        .modal-title{font-size:18px;font-weight:600}
        .modal-close{width:32px;height:32px;border-radius:4px;border:none;background:transparent;cursor:pointer;font-size:20px;color:var(--text-secondary);}
        .modal-body{padding:24px}
        .modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
        .form-group{margin-bottom:16px;}
        .form-label{display:block;font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:6px;}
        .form-input,.form-select{width:100%;padding:8px 12px;border:1px solid var(--border-strong);border-radius:4px;font-size:14px;font-family:inherit;}
        .form-input:focus,.form-select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,120,212,0.15);}
        .toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:500;z-index:9999;box-shadow:var(--shadow-md);animation:slideIn 0.3s ease}
        .toast-success{background:#DFF6DD;color:#0B5C0B;border:1px solid #A7F0BA}
        .toast-error{background:#FDE7E9;color:#A80000;border:1px solid #FDB8BA}
        @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
        .top-nav{height:60px;background:#FFFFFF;border-bottom:1px solid #EDEBE9;display:flex;align-items:center;padding:0 32px;position:fixed;top:0;left:0;right:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
        .logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;color:var(--brand);text-decoration:none;}
        .logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#107C10,#389146);border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:18px;}
        .nav-menu{display:flex;align-items:center;gap:4px;margin-left:48px;list-style:none;}
        .nav-menu li a{padding:6px 14px;border-radius:4px;font-size:14px;color:var(--text-secondary);text-decoration:none;transition:all 0.2s;cursor:pointer;display:block;}
        .nav-menu li a:hover{background:var(--bg-secondary);color:var(--text-primary)}
        .nav-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
        .user-avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);color:white;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;}
        .total-weight{font-size:14px;color:var(--text-secondary);margin-bottom:16px;padding:12px;background:var(--bg-tertiary);border-radius:6px;}
        .total-weight strong{color:var(--brand)}
    </style>
</head>
<body>
    <nav class="top-nav">
        <a href="/dashboard.html" class="logo">
            <div class="logo-icon">🌲</div>
            <span>绿林工具绩效管理系统</span>
        </a>
        <ul class="nav-menu" id="navMenu"></ul>
        <div class="nav-right" id="navRight"></div>
    </nav>

    <div class="page-wrapper">
        <div class="page-header">
            <h1 class="page-title">业务指标</h1>
            <button class="btn btn-primary" onclick="openAdd()" id="addBtn">+ 新增指标</button>
        </div>

        <div class="card">
            <div class="total-weight" id="totalWeight">权重总计：<strong>0%</strong>（应等于100%）</div>
            <div id="tableContainer"></div>
        </div>
    </div>

    <div class="modal-overlay" id="metricModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">新增指标</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="metricForm">
                    <input type="hidden" id="metricId">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">指标编码 <span style="color:red">*</span></label>
                            <input type="text" class="form-input" id="mCode" required placeholder="如: MET006">
                        </div>
                        <div class="form-group">
                            <label class="form-label">指标名称 <span style="color:red">*</span></label>
                            <input type="text" class="form-input" id="mName" required placeholder="如: 新客户开发数">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">指标类型</label>
                            <select class="form-select" id="mType" onchange="toggleTarget()">
                                <option value="quantitative">量化指标</option>
                                <option value="qualitative">非量化指标</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">权重(%) <span style="color:red">*</span></label>
                            <input type="number" class="form-input" id="mWeight" required min="1" max="100" placeholder="0-100">
                        </div>
                    </div>
                    <div class="form-row" id="targetRow">
                        <div class="form-group">
                            <label class="form-label">单位</label>
                            <input type="text" class="form-input" id="mUnit" placeholder="如: 万元、%、次">
                        </div>
                        <div class="form-group">
                            <label class="form-label">目标值</label>
                            <input type="number" class="form-input" id="mTarget" placeholder="量化指标的目标值">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">描述说明</label>
                        <textarea class="form-input" id="mDesc" rows="3" placeholder="指标的详细说明和评分标准"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="submitMetric()">保存</button>
            </div>
        </div>
    </div>

    <script>
    const API = '/api';
    let editingId = null;

    function getToken() { return localStorage.getItem('pbc_token') || ''; }
    function getUser() { const u = localStorage.getItem('pbc_user'); return u ? JSON.parse(u) : null; }

    async function api(url, opts = {}) {
        const headers = { 'Content-Type': 'application/json' };
        const token = getToken();
        if (token) headers['Authorization'] = 'Bearer ' + token;
        const res = await fetch(API + url, { ...opts, headers: { ...headers, ...opts.headers } });
        const data = await res.json();
        if (!res.ok || !data.success) {
            if (res.status === 401) { location.href = '/login.html'; }
            throw new Error(data.message || '失败');
        }
        return data;
    }

    function toast(msg, type = 'info') {
        const t = document.createElement('div');
        t.className = 'toast toast-' + type;
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    function logout() { localStorage.removeItem('pbc_token'); localStorage.removeItem('pbc_user'); location.href = '/login.html'; }

    function initNav() {
        const user = getUser();
        if (!user) { location.href = '/login.html'; return; }
        const roleLabel = { admin: '管理员', manager: '部门经理', employee: '员工' };
        const menus = {
            admin: [{label:'工作台',url:'/dashboard.html'},{label:'员工管理',url:'/employees.html'},{label:'业务指标',url:'/metrics.html'},{label:'数据录入',url:'/data-entry.html'},{label:'考核模板',url:'/appraisal-template.html'},{label:'考核周期',url:'/appraisal-cycle.html'},{label:'考核管理',url:'/appraisal-list.html'},{label:'报表中心',url:'/reports.html'}],
            manager: [{label:'工作台',url:'/dashboard.html'},{label:'员工管理',url:'/employees.html'},{label:'数据录入',url:'/data-entry.html'},{label:'考核管理',url:'/appraisal-list.html'}],
            employee: [{label:'工作台',url:'/dashboard.html'},{label:'我的考核',url:'/appraisal-list.html'}]
        };
        document.getElementById('navMenu').innerHTML = (menus[user.role]||[]).map(m => `<li><a href="${m.url}">${m.label}</a></li>`).join('');
        document.getElementById('navRight').innerHTML = `<div class="user-avatar" style="cursor:pointer;" onclick="logout()">${(user.username||'U')[0].toUpperCase()}</div>`;
        document.getElementById('addBtn').style.display = user.role === 'admin' ? '' : 'none';
    }

    async function loadMetrics() {
        try {
            const data = await api('/metric/metrics');
            renderMetrics(data.data || []);
        } catch (e) { toast('加载失败: ' + e.message, 'error'); }
    }

    function renderMetrics(metrics) {
        const total = metrics.reduce((s, m) => s + (m.weight || 0), 0);
        document.getElementById('totalWeight').innerHTML = `权重总计：<strong style="color:${total === 100 ? 'var(--success)' : 'var(--error)'}">${total}%</strong>（应等于100%）`;

        if (!metrics.length) {
            document.getElementById('tableContainer').innerHTML = '<div style="text-align:center;padding:48px;color:var(--text-secondary);">暂无指标数据</div>';
            return;
        }

        const user = getUser();
        const isAdmin = user && user.role === 'admin';

        document.getElementById('tableContainer').innerHTML = `
            <table>
                <thead><tr><th>编码</th><th>名称</th><th>类型</th><th>单位</th><th>权重</th><th>目标值</th><th>描述</th>${isAdmin?'<th style="text-align:right">操作</th>':''}</tr></thead>
                <tbody>${metrics.map(m => `
                    <tr>
                        <td><code style="background:#F3F2F1;padding:2px 6px;border-radius:4px;font-size:12px;">${m.code||''}</code></td>
                        <td><strong>${m.name||''}</strong></td>
                        <td><span class="badge ${m.metric_type==='quantitative'?'badge-q':'badge-nq'}">${m.metric_type==='quantitative'?'量化':'非量化'}</span></td>
                        <td>${m.unit||'-'}</td>
                        <td><div class="weight-bar"><div class="bar" style="width:${(m.weight||0)*2}px"></div><strong>${m.weight}%</strong></div></td>
                        <td>${m.target_value != null ? m.target_value : '-'}</td>
                        <td style="max-width:200px;color:var(--text-secondary);font-size:13px;">${m.description||'-'}</td>
                        ${isAdmin?`<td class="actions" style="text-align:right;">
                            <button class="btn-edit" onclick="editMetric(${m.id})">编辑</button>
                            <button class="btn-delete" onclick="deleteMetric(${m.id})">删除</button>
                        </td>`:''}
                    </tr>`).join('')}</tbody>
            </table>`;
    }

    function toggleTarget() {
        const type = document.getElementById('mType').value;
        document.getElementById('targetRow').style.display = type === 'quantitative' ? '' : 'none';
    }

    function openAdd() {
        editingId = null;
        document.getElementById('modalTitle').textContent = '新增指标';
        document.getElementById('metricForm').reset();
        document.getElementById('metricId').value = '';
        document.getElementById('metricModal').classList.add('show');
    }

    async function editMetric(id) {
        editingId = id;
        document.getElementById('modalTitle').textContent = '编辑指标';
        try {
            const data = await api('/metric/metrics/' + id);
            const m = data.data;
            document.getElementById('metricId').value = m.id;
            document.getElementById('mCode').value = m.code || '';
            document.getElementById('mName').value = m.name || '';
            document.getElementById('mType').value = m.metric_type || 'quantitative';
            document.getElementById('mWeight').value = m.weight || '';
            document.getElementById('mUnit').value = m.unit || '';
            document.getElementById('mTarget').value = m.target_value || '';
            document.getElementById('mDesc').value = m.description || '';
            toggleTarget();
        } catch (err) { toast(err.message, 'error'); }
        document.getElementById('metricModal').classList.add('show');
    }

    function closeModal() { document.getElementById('metricModal').classList.remove('show'); editingId = null; }

    async function submitMetric() {
        const form = {
            code: document.getElementById('mCode').value.trim(),
            name: document.getElementById('mName').value.trim(),
            metric_type: document.getElementById('mType').value,
            weight: parseFloat(document.getElementById('mWeight').value),
            unit: document.getElementById('mUnit').value.trim(),
            target_value: parseFloat(document.getElementById('mTarget').value) || null,
            description: document.getElementById('mDesc').value.trim(),
        };
        if (!form.code || !form.name || !form.weight) { toast('编码、名称、权重不能为空', 'error'); return; }
        try {
            if (editingId) { await api('/metric/metrics/' + editingId, {method:'PUT', body:JSON.stringify(form)}); toast('更新成功', 'success'); }
            else { await api('/metric/metrics', {method:'POST', body:JSON.stringify(form)}); toast('创建成功', 'success'); }
            closeModal();
            loadMetrics();
        } catch (err) { toast(err.message, 'error'); }
    }

    async function deleteMetric(id) {
        if (!confirm('确定删除该指标？')) return;
        try { await api('/metric/metrics/' + id, {method:'DELETE'}); toast('删除成功', 'success'); loadMetrics(); }
        catch (err) { toast(err.message, 'error'); }
    }

    initNav();
    loadMetrics();
    </script>
</body>
</html>
