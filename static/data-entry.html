<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据录入 - 绿林工具绩效管理系统</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--brand:#0078D4;--brand-hover:#106EBE;--text-primary:#323130;--text-secondary:#605E5C;--bg-primary:#FFFFFF;--bg-secondary:#F3F2F1;--bg-tertiary:#FAFAFA;--border:#EDEBE9;--border-strong:#D2D0CE;--success:#107C10;--warning:#FF8C00;--error:#D13438;--shadow-sm:0 2px 4px rgba(0,0,0,0.08);--shadow-md:0 4px 12px rgba(0,0,0,0.1);}
        body{font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.6;color:var(--text-primary);background:var(--bg-secondary);}
        .page-wrapper{margin-top:60px;padding:32px;}
        .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
        .page-title{font-size:28px;font-weight:600;}
        .card{background:white;border-radius:8px;box-shadow:var(--shadow-sm);padding:24px;margin-bottom:16px;}
        .card-title{font-size:18px;font-weight:600;margin-bottom:16px;}
        .btn{padding:8px 20px;border-radius:4px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all 0.2s;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
        .btn:active{transform:scale(0.98)}
        .btn-primary{background:var(--brand);color:white}.btn-primary:hover{background:var(--brand-hover)}
        .btn-secondary{background:white;color:var(--text-primary);border:1px solid var(--border-strong)}.btn-secondary:hover{background:var(--bg-secondary)}
        .btn-success{background:var(--success);color:white}
        .filter-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
        .filter-group{display:flex;flex-direction:column;gap:4px;}
        .filter-label{font-size:12px;font-weight:600;color:var(--text-secondary);}
        .filter-input,.filter-select{padding:7px 12px;border:1px solid var(--border-strong);border-radius:4px;font-size:14px;font-family:inherit;}
        .filter-input:focus,.filter-select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,120,212,0.15);}
        table{width:100%;border-collapse:collapse;font-size:14px;}
        table th{background:var(--bg-tertiary);padding:12px 16px;text-align:left;font-weight:600;border-bottom:1px solid var(--border);}
        table td{padding:12px 16px;border-bottom:1px solid var(--border);}
        table tr:hover td{background:#F5F9FD}
        .rate{font-weight:600;color:var(--brand)}
        .rate.high{color:var(--success)}
        .rate.low{color:var(--error)}
        .badge{padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;display:inline-block;}
        .badge-success{background:#DFF6DD;color:#107C10}
        .badge-warning{background:#FFF4CE;color:#797643}
        .badge-error{background:#FDE7E9;color:#D13438}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity 0.2s;}
        .modal-overlay.show{opacity:1;pointer-events:all}
        .modal{background:white;border-radius:8px;box-shadow:var(--shadow-md);width:600px;max-height:85vh;overflow:auto;transform:translateY(20px);transition:transform 0.2s;}
        .modal-overlay.show .modal{transform:translateY(0)}
        .modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
        .modal-title{font-size:18px;font-weight:600}
        .modal-close{width:32px;height:32px;border-radius:4px;border:none;background:transparent;cursor:pointer;font-size:20px;color:var(--text-secondary);}
        .modal-body{padding:24px}
        .modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
        .form-group{margin-bottom:16px;}
        .form-label{display:block;font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:6px;}
        .form-input,.form-select,.form-textarea{width:100%;padding:8px 12px;border:1px solid var(--border-strong);border-radius:4px;font-size:14px;font-family:inherit;}
        .form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,120,212,0.15);}
        .form-textarea{resize:vertical;min-height:60px}
        .toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:500;z-index:9999;box-shadow:var(--shadow-md);animation:slideIn 0.3s ease}
        .toast-success{background:#DFF6DD;color:#0B5C0B;border:1px solid #A7F0BA}
        .toast-error{background:#FDE7E9;color:#A80000;border:1px solid #FDB8BA}
        @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
        .top-nav{height:60px;background:#FFFFFF;border-bottom:1px solid #EDEBE9;display:flex;align-items:center;padding:0 32px;position:fixed;top:0;left:0;right:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
        .logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;color:var(--brand);text-decoration:none;}
        .logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#107C10,#389146);border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:18px;}
        .nav-menu{display:flex;align-items:center;gap:4px;margin-left:48px;list-style:none;}
        .nav-menu li a{padding:6px 14px;border-radius:4px;font-size:14px;color:var(--text-secondary);text-decoration:none;transition:all 0.2s;cursor:pointer;display:block;}
        .nav-menu li a:hover{background:var(--bg-secondary);color:var(--text-primary)}
        .nav-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
        .user-avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);color:white;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;}
        .pagination{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:16px;font-size:14px;}
        .pagination button{padding:6px 12px;border:1px solid var(--border);background:white;border-radius:4px;cursor:pointer;font-size:14px;}
        .pagination button:hover{background:var(--bg-secondary)}
        .pagination button.active{background:var(--brand);color:white;border-color:var(--brand)}
        .empty-state{text-align:center;padding:48px;color:var(--text-secondary);}
        .empty-state .empty-icon{font-size:48px;margin-bottom:12px;opacity:0.3;}
    </style>
</head>
<body>
    <nav class="top-nav">
        <a href="/dashboard.html" class="logo"><div class="logo-icon">🌲</div><span>绿林工具绩效管理系统</span></a>
        <ul class="nav-menu" id="navMenu"></ul>
        <div class="nav-right" id="navRight"></div>
    </nav>

    <div class="page-wrapper">
        <div class="page-header">
            <h1 class="page-title">业务数据录入</h1>
            <div style="display:flex;gap:8px;">
                <button class="btn btn-secondary" onclick="openBatchModal()">批量录入</button>
                <button class="btn btn-primary" onclick="openAddModal()">+ 新增录入</button>
            </div>
        </div>

        <div class="card">
            <div class="filter-row">
                <div class="filter-group">
                    <label class="filter-label">考核周期</label>
                    <select class="filter-select" id="filterCycle" onchange="loadData(1)"></select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">员工</label>
                    <select class="filter-select" id="filterEmployee" onchange="loadData(1)"></select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">指标</label>
                    <select class="filter-select" id="filterMetric" onchange="loadData(1)"></select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">期间</label>
                    <input type="month" class="filter-input" id="filterPeriod" onchange="loadData(1)">
                </div>
                <button class="btn btn-secondary" onclick="resetFilters()">重置</button>
            </div>
            <div id="tableContainer"></div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <!-- 单条录入 -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">录入业务数据</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="dataForm">
                    <input type="hidden" id="dataId">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">考核周期 <span style="color:red">*</span></label>
                            <select class="form-select" id="dCycle" required onchange="loadCycleMetrics()"></select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">员工 <span style="color:red">*</span></label>
                            <select class="form-select" id="dEmployee" required></select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">业务指标 <span style="color:red">*</span></label>
                            <select class="form-select" id="dMetric" required></select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">期间</label>
                            <input type="month" class="form-input" id="dPeriod">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">目标值</label>
                            <input type="number" class="form-input" id="dTarget" step="0.01" placeholder="留空则使用指标默认值">
                        </div>
                        <div class="form-group">
                            <label class="form-label">实际值 <span style="color:red">*</span></label>
                            <input type="number" class="form-input" id="dActual" required step="0.01" placeholder="请输入实际完成值">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="submitData()">保存</button>
            </div>
        </div>
    </div>

    <!-- 批量录入 -->
    <div class="modal-overlay" id="batchModal">
        <div class="modal" style="width:800px;">
            <div class="modal-header">
                <h2 class="modal-title">批量录入</h2>
                <button class="modal-close" onclick="closeBatchModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p style="font-size:14px;color:var(--text-secondary);margin-bottom:16px;">
                    选择考核周期和员工，系统将自动列出所有指标的目标值，您只需填写实际值即可。
                </p>
                <div class="form-row" style="margin-bottom:16px;">
                    <div class="form-group">
                        <label class="form-label">考核周期 <span style="color:red">*</span></label>
                        <select class="form-select" id="bCycle" onchange="loadBatchData()"></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">员工 <span style="color:red">*</span></label>
                        <select class="form-select" id="bEmployee" onchange="loadBatchData()"></select>
                    </div>
                </div>
                <div id="batchTable" style="max-height:400px;overflow:auto;"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeBatchModal()">取消</button>
                <button class="btn btn-success" onclick="submitBatch()">提交批量数据</button>
            </div>
        </div>
    </div>

    <script>
    const API = '/api';
    let currentPage = 1;
    let cycles = [], employees = [], metrics = [];
    let batchRecords = [];

    function getToken() { return localStorage.getItem('pbc_token') || ''; }
    function getUser() { const u = localStorage.getItem('pbc_user'); return u ? JSON.parse(u) : null; }

    async function api(url, opts = {}) {
        const headers = { 'Content-Type': 'application/json' };
        const token = getToken();
        if (token) headers['Authorization'] = 'Bearer ' + token;
        const res = await fetch(API + url, { ...opts, headers: { ...headers, ...opts.headers } });
        const data = await res.json();
        if (!res.ok || !data.success) {
            if (res.status === 401) location.href = '/login.html';
            throw new Error(data.message || '失败');
        }
        return data;
    }

    function toast(msg, type = 'info') {
        const t = document.createElement('div');
        t.className = 'toast toast-' + type;
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    function logout() { localStorage.removeItem('pbc_token'); localStorage.removeItem('pbc_user'); location.href = '/login.html'; }

    function initNav() {
        const user = getUser();
        if (!user) { location.href = '/login.html'; return; }
        const menus = {
            admin: [{label:'工作台',url:'/dashboard.html'},{label:'员工管理',url:'/employees.html'},{label:'业务指标',url:'/metrics.html'},{label:'数据录入',url:'/data-entry.html'},{label:'考核模板',url:'/appraisal-template.html'},{label:'考核周期',url:'/appraisal-cycle.html'},{label:'考核管理',url:'/appraisal-list.html'},{label:'报表中心',url:'/reports.html'}],
            manager: [{label:'工作台',url:'/dashboard.html'},{label:'员工管理',url:'/employees.html'},{label:'数据录入',url:'/data-entry.html'},{label:'考核管理',url:'/appraisal-list.html'}],
            employee: [{label:'工作台',url:'/dashboard.html'},{label:'我的考核',url:'/appraisal-list.html'}]
        };
        document.getElementById('navMenu').innerHTML = (menus[user.role]||[]).map(m => `<li><a href="${m.url}">${m.label}</a></li>`).join('');
        document.getElementById('navRight').innerHTML = `<div class="user-avatar" style="cursor:pointer;" onclick="logout()">${(user.username||'U')[0].toUpperCase()}</div>`;
    }

    async function init() {
        await Promise.all([loadCycles(), loadEmployees(), loadMetrics()]);
        loadData(1);
    }

    async function loadCycles() {
        try {
            const data = await api('/appraisal/cycles');
            cycles = data.data || [];
            const opts = cycles.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            document.getElementById('filterCycle').innerHTML = '<option value="">全部周期</option>' + opts;
            document.getElementById('dCycle').innerHTML = '<option value="">请选择</option>' + opts;
            document.getElementById('bCycle').innerHTML = '<option value="">请选择</option>' + opts;
        } catch(e) {}
    }

    async function loadEmployees() {
        try {
            const data = await api('/employee/list?page_size=100&status=active');
            employees = data.data.items || [];
            const opts = employees.map(e => `<option value="${e.id}">${e.name} (${e.employee_no||''})</option>`).join('');
            document.getElementById('filterEmployee').innerHTML = '<option value="">全部员工</option>' + opts;
            document.getElementById('dEmployee').innerHTML = '<option value="">请选择</option>' + opts;
            document.getElementById('bEmployee').innerHTML = '<option value="">请选择</option>' + opts;
        } catch(e) {}
    }

    async function loadMetrics() {
        try {
            const data = await api('/metric/metrics');
            metrics = data.data || [];
        } catch(e) {}
    }

    async function loadData(page = 1) {
        currentPage = page;
        try {
            const params = new URLSearchParams({ page, page_size: 20 });
            const cycleId = document.getElementById('filterCycle').value;
            const empId = document.getElementById('filterEmployee').value;
            const metricId = document.getElementById('filterMetric').value;
            const period = document.getElementById('filterPeriod').value;
            if (cycleId) params.append('cycle_id', cycleId);
            if (empId) params.append('employee_id', empId);
            if (metricId) params.append('metric_id', metricId);
            if (period) params.append('period', period);
            const data = await api('/metric/data?' + params.toString());
            renderData(data.data || {});
        } catch (e) { toast('加载失败: ' + e.message, 'error'); }
    }

    function renderData(result) {
        const items = result.items || [];
        if (!items.length) {
            document.getElementById('tableContainer').innerHTML = '<div class="empty-state"><div class="empty-icon">📊</div><p>暂无业务数据</p></div>';
            document.getElementById('pagination').innerHTML = '';
            return;
        }
        document.getElementById('tableContainer').innerHTML = `
            <table>
                <thead><tr><th>员工</th><th>指标</th><th>考核周期</th><th>期间</th><th>目标值</th><th>实际值</th><th>达成率</th><th>录入时间</th></tr></thead>
                <tbody>${items.map(d => {
                    const rate = d.achievement_rate;
                    const rateClass = rate >= 100 ? 'high' : rate < 80 ? 'low' : '';
                    return `<tr>
                        <td>${d.employee ? d.employee.name : '-'}</td>
                        <td><strong>${d.metric ? d.metric.name : '-'}</strong><br><code style="font-size:11px;color:var(--text-secondary)">${d.metric ? d.metric.code : ''}</code></td>
                        <td>${d.cycle ? d.cycle.name : '-'}</td>
                        <td>${d.period || '-'}</td>
                        <td>${d.target_value != null ? d.target_value + (d.metric ? ' ' + d.metric.unit : '') : '-'}</td>
                        <td><strong>${d.actual_value}</strong>${d.metric && d.metric.unit ? ' ' + d.metric.unit : ''}</td>
                        <td class="rate ${rateClass}">${rate != null ? rate + '%' : '-'}</td>
                        <td style="font-size:12px;color:var(--text-secondary)">${d.entered_at ? new Date(d.entered_at).toLocaleDateString('zh-CN') : '-'}</td>
                    </tr>`;
                }).join('')}</tbody>
            </table>`;
        renderPagination(result);
    }

    function renderPagination(pg) {
        if (!pg || pg.pages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }
        let btns = `<button ${pg.page <= 1 ? 'disabled' : ''} onclick="loadData(${pg.page-1})">上一页</button>`;
        for (let i = 1; i <= pg.pages; i++) {
            if (i === 1 || i === pg.pages || Math.abs(i - pg.page) <= 2)
                btns += `<button class="${i === pg.page ? 'active' : ''}" onclick="loadData(${i})">${i}</button>`;
        }
        btns += `<button ${pg.page >= pg.pages ? 'disabled' : ''} onclick="loadData(${pg.page+1})">下一页</button>`;
        document.getElementById('pagination').innerHTML = `<span style="margin-right:auto;font-size:13px;color:var(--text-secondary)">共 ${pg.total} 条</span>` + btns;
    }

    function openAddModal() {
        document.getElementById('dataForm').reset();
        document.getElementById('dataId').value = '';
        document.getElementById('addModal').classList.add('show');
    }

    function closeModal() { document.getElementById('addModal').classList.remove('show'); }

    async function loadCycleMetrics() {
        const cycleId = document.getElementById('dCycle').value;
        if (!cycleId) return;
        // Load metrics for selection
        const opts = metrics.map(m => `<option value="${m.id}" data-unit="${m.unit||''}" data-target="${m.target_value||''}">${m.name} (权重${m.weight}%)</option>`).join('');
        document.getElementById('dMetric').innerHTML = '<option value="">请选择</option>' + opts;
    }

    async function submitData() {
        const cycleId = document.getElementById('dCycle').value;
        const empId = document.getElementById('dEmployee').value;
        const metricId = document.getElementById('dMetric').value;
        const actual = document.getElementById('dActual').value;
        if (!cycleId || !empId || !metricId || !actual) { toast('请填写完整信息', 'error'); return; }
        const form = {
            cycle_id: parseInt(cycleId),
            employee_id: parseInt(empId),
            metric_id: parseInt(metricId),
            period: document.getElementById('dPeriod').value,
            target_value: parseFloat(document.getElementById('dTarget').value) || null,
            actual_value: parseFloat(actual),
        };
        try {
            await api('/metric/data', {method:'POST', body:JSON.stringify(form)});
            toast('录入成功', 'success');
            closeModal();
            loadData(currentPage);
        } catch (e) { toast(e.message, 'error'); }
    }

    function openBatchModal() { document.getElementById('batchModal').classList.add('show'); }
    function closeBatchModal() { document.getElementById('batchModal').classList.remove('show'); }

    async function loadBatchData() {
        const cycleId = document.getElementById('bCycle').value;
        const empId = document.getElementById('bEmployee').value;
        if (!cycleId || !empId) { document.getElementById('batchTable').innerHTML = '<p style="text-align:center;color:var(--text-secondary);padding:32px;">请先选择考核周期和员工</p>'; return; }
        document.getElementById('batchTable').innerHTML = '<p style="text-align:center;color:var(--text-secondary);padding:32px;">加载中...</p>';
        batchRecords = metrics.map(m => ({
            metric_id: m.id,
            metric_name: m.name,
            metric_code: m.code,
            unit: m.unit,
            target_value: m.target_value,
            actual_value: '',
        }));
        document.getElementById('batchTable').innerHTML = `
            <table>
                <thead><tr><th>指标编码</th><th>指标名称</th><th>单位</th><th>目标值</th><th>实际值</th></tr></thead>
                <tbody>${batchRecords.map((r, i) => `
                    <tr>
                        <td><code>${r.metric_code}</code></td>
                        <td>${r.metric_name}</td>
                        <td>${r.unit || '-'}</td>
                        <td>${r.target_value != null ? r.target_value : '-'}</td>
                        <td><input type="number" class="form-input" id="bActual_${i}" step="0.01" placeholder="请填写" style="width:120px"></td>
                    </tr>`).join('')}</tbody>
            </table>`;
    }

    async function submitBatch() {
        const cycleId = parseInt(document.getElementById('bCycle').value);
        const empId = parseInt(document.getElementById('bEmployee').value);
        if (!cycleId || !empId) { toast('请选择周期和员工', 'error'); return; }
        const records = [];
        batchRecords.forEach((r, i) => {
            const val = document.getElementById('bActual_' + i).value;
            if (val) {
                records.push({
                    cycle_id: cycleId,
                    employee_id: empId,
                    metric_id: r.metric_id,
                    actual_value: parseFloat(val),
                    target_value: r.target_value,
                });
            }
        });
        if (!records.length) { toast('请至少填写一条数据', 'error'); return; }
        try {
            await api('/metric/data/batch', {method:'POST', body:JSON.stringify({records})});
            toast('批量录入成功！', 'success');
            closeBatchModal();
            loadData(1);
        } catch (e) { toast(e.message, 'error'); }
    }

    function resetFilters() {
        document.getElementById('filterCycle').value = '';
        document.getElementById('filterEmployee').value = '';
        document.getElementById('filterMetric').value = '';
        document.getElementById('filterPeriod').value = '';
        loadData(1);
    }

    initNav();
    init();
    </script>
</body>
</html>
