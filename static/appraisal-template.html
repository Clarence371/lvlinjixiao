<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考核模板 - 绿林工具绩效管理系统</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--brand:#0078D4;--brand-hover:#106EBE;--text-primary:#323130;--text-secondary:#605E5C;--bg-primary:#FFFFFF;--bg-secondary:#F3F2F1;--bg-tertiary:#FAFAFA;--border:#EDEBE9;--border-strong:#D2D0CE;--success:#107C10;--warning:#FF8C00;--error:#D13438;--shadow-sm:0 2px 4px rgba(0,0,0,0.08);--shadow-md:0 4px 12px rgba(0,0,0,0.1);}
        body{font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.6;color:var(--text-primary);background:var(--bg-secondary);}
        .page-wrapper{margin-top:60px;padding:32px;}
        .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
        .page-title{font-size:28px;font-weight:600;}
        .card{background:white;border-radius:8px;box-shadow:var(--shadow-sm);padding:24px;margin-bottom:16px;}
        .card-title{font-size:18px;font-weight:600;margin-bottom:16px;}
        .btn{padding:8px 20px;border-radius:4px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all 0.2s;font-family:inherit;}
        .btn:active{transform:scale(0.98)}
        .btn-primary{background:var(--brand);color:white}.btn-primary:hover{background:var(--brand-hover)}
        .btn-secondary{background:white;color:var(--text-primary);border:1px solid var(--border-strong)}.btn-secondary:hover{background:var(--bg-secondary)}
        .btn-edit{background:#DEECF9;color:var(--brand);border:none;cursor:pointer;border-radius:4px;font-size:13px;padding:5px 12px}
        .btn-delete{background:#FDE7E9;color:var(--error);border:none;cursor:pointer;border-radius:4px;font-size:13px;padding:5px 12px}
        .template-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:16px;}
        .template-card{background:white;border-radius:8px;padding:20px;border:1px solid var(--border);transition:all 0.2s}
        .template-card:hover{border-color:var(--brand);box-shadow:var(--shadow-sm)}
        .template-card .tpl-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
        .template-card .tpl-name{font-size:17px;font-weight:600}
        .template-card .tpl-desc{font-size:13px;color:var(--text-secondary);margin-bottom:12px}
        .template-card .metric-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
        .template-card .metric-tag{padding:3px 10px;background:var(--bg-secondary);border-radius:12px;font-size:12px;color:var(--text-secondary)}
        .template-card .metric-tag strong{color:var(--brand)}
        .template-card .weight-total{font-size:13px;color:var(--text-secondary);margin-bottom:12px;padding:6px 10px;background:var(--bg-tertiary);border-radius:6px}
        .template-card .actions{display:flex;gap:8px;justify-content:flex-end}
        .badge{padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;display:inline-block}
        .badge-active{background:#DFF6DD;color:#107C10}
        .badge-inactive{background:#FDE7E9;color:#D13438}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity 0.2s}
        .modal-overlay.show{opacity:1;pointer-events:all}
        .modal{background:white;border-radius:8px;box-shadow:var(--shadow-md);width:600px;max-height:85vh;overflow:auto;transform:translateY(20px);transition:transform 0.2s}
        .modal-overlay.show .modal{transform:translateY(0)}
        .modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
        .modal-title{font-size:18px;font-weight:600}
        .modal-close{width:32px;height:32px;border-radius:4px;border:none;background:transparent;cursor:pointer;font-size:20px;color:var(--text-secondary)}
        .modal-body{padding:24px}
        .modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
        .form-group{margin-bottom:16px}
        .form-label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
        .form-input,.form-select{width:100%;padding:8px 12px;border:1px solid var(--border-strong);border-radius:4px;font-size:14px;font-family:inherit}
        .form-input:focus,.form-select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,120,212,0.15)}
        .metric-picker{border:1px solid var(--border);border-radius:6px;max-height:250px;overflow:auto;padding:12px}
        .metric-picker-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:4px;margin-bottom:6px}
        .metric-picker-item:hover{background:var(--bg-secondary)}
        .metric-picker-item input{width:16px;height:16px}
        .metric-picker-item .m-info{flex:1}
        .metric-picker-item .m-name{font-weight:600;font-size:14px}
        .metric-picker-item .m-meta{font-size:12px;color:var(--text-secondary)}
        .metric-picker-item .m-weight input{width:80px}
        .toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:500;z-index:9999;box-shadow:var(--shadow-md);animation:slideIn 0.3s ease}
        .toast-success{background:#DFF6DD;color:#0B5C0B}
        .toast-error{background:#FDE7E9;color:#A80000}
        @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
        .top-nav{height:60px;background:#fff;border-bottom:1px solid #EDEBE9;display:flex;align-items:center;padding:0 32px;position:fixed;top:0;left:0;right:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
        .logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;color:var(--brand);text-decoration:none}
        .logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#107C10,#389146);border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:18px}
        .nav-menu{display:flex;align-items:center;gap:4px;margin-left:48px;list-style:none}
        .nav-menu li a{padding:6px 14px;border-radius:4px;font-size:14px;color:var(--text-secondary);text-decoration:none;transition:all 0.2s;cursor:pointer;display:block}
        .nav-menu li a:hover{background:var(--bg-secondary)}
        .nav-right{margin-left:auto}
        .user-avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);color:white;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;cursor:pointer}
        .empty-state{text-align:center;padding:48px;color:var(--text-secondary)}
        .empty-icon{font-size:48px;opacity:0.3;margin-bottom:12px}
    </style>
</head>
<body>
    <nav class="top-nav">
        <a href="/dashboard.html" class="logo"><div class="logo-icon">🌲</div><span>绿林工具绩效管理系统</span></a>
        <ul class="nav-menu" id="navMenu"></ul>
        <div class="nav-right" id="navRight"></div>
    </nav>

    <div class="page-wrapper">
        <div class="page-header">
            <h1 class="page-title">考核模板</h1>
            <button class="btn btn-primary" onclick="openAdd()" id="addBtn">+ 新建模板</button>
        </div>
        <div id="templateList"></div>
    </div>

    <div class="modal-overlay" id="tplModal">
        <div class="modal" style="width:640px;">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">新建考核模板</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="tplForm">
                    <input type="hidden" id="tplId">
                    <div class="form-group">
                        <label class="form-label">模板名称 <span style="color:red">*</span></label>
                        <input type="text" class="form-input" id="tName" required placeholder="如: 销售岗位绩效考核模板">
                    </div>
                    <div class="form-group">
                        <label class="form-label">适用范围</label>
                        <select class="form-select" id="tPosition">
                            <option value="通用">通用</option>
                            <option value="管理层">管理层</option>
                            <option value="销售">销售</option>
                            <option value="技术">技术</option>
                            <option value="行政">行政</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">描述说明</label>
                        <textarea class="form-input" id="tDesc" rows="2" placeholder="模板的详细说明"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">选择考核指标及权重 <span style="color:red">*</span>（权重合计必须等于100%）</label>
                        <div class="metric-picker" id="metricPicker"></div>
                        <div style="margin-top:8px;font-size:13px;color:var(--text-secondary)">
                            权重合计：<strong id="weightSum">0%</strong>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="submitTemplate()">保存</button>
            </div>
        </div>
    </div>

    <script>
    const API = '/api';
    let editingId = null;
    let allMetrics = [];
    let selectedMetrics = [];

    function getToken() { return localStorage.getItem('pbc_token') || ''; }
    function getUser() { const u = localStorage.getItem('pbc_user'); return u ? JSON.parse(u) : null; }

    async function api(url, opts = {}) {
        const headers = { 'Content-Type': 'application/json' };
        const token = getToken();
        if (token) headers['Authorization'] = 'Bearer ' + token;
        const res = await fetch(API + url, { ...opts, headers: { ...headers, ...opts.headers } });
        const data = await res.json();
        if (!res.ok || !data.success) {
            if (res.status === 401) location.href = '/login.html';
            throw new Error(data.message || '失败');
        }
        return data;
    }

    function toast(msg, type = 'info') {
        const t = document.createElement('div');
        t.className = 'toast toast-' + type;
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    function logout() { localStorage.removeItem('pbc_token'); localStorage.removeItem('pbc_user'); location.href = '/login.html'; }

    function initNav() {
        const user = getUser();
        if (!user) { location.href = '/login.html'; return; }
        const menus = {
            admin: [{label:'工作台',url:'/dashboard.html'},{label:'员工管理',url:'/employees.html'},{label:'业务指标',url:'/metrics.html'},{label:'数据录入',url:'/data-entry.html'},{label:'考核模板',url:'/appraisal-template.html'},{label:'考核周期',url:'/appraisal-cycle.html'},{label:'考核管理',url:'/appraisal-list.html'},{label:'报表中心',url:'/reports.html'}],
            manager: [{label:'工作台',url:'/dashboard.html'},{label:'员工管理',url:'/employees.html'},{label:'数据录入',url:'/data-entry.html'},{label:'考核管理',url:'/appraisal-list.html'}],
            employee: [{label:'工作台',url:'/dashboard.html'},{label:'我的考核',url:'/appraisal-list.html'}]
        };
        document.getElementById('navMenu').innerHTML = (menus[user.role]||[]).map(m => `<li><a href="${m.url}">${m.label}</a></li>`).join('');
        document.getElementById('navRight').innerHTML = `<div class="user-avatar" onclick="logout()">${(user.username||'U')[0].toUpperCase()}</div>`;
        document.getElementById('addBtn').style.display = user.role === 'admin' ? '' : 'none';
    }

    async function loadTemplates() {
        try {
            const data = await api('/appraisal/templates');
            renderTemplates(data.data || []);
        } catch (e) { toast('加载失败', 'error'); }
    }

    async function loadMetricsForPicker() {
        const data = await api('/metric/metrics');
        allMetrics = data.data || [];
        renderMetricPicker();
    }

    function renderMetricPicker() {
        document.getElementById('metricPicker').innerHTML = allMetrics.map(m => `
            <div class="metric-picker-item">
                <input type="checkbox" id="mcb_${m.id}" value="${m.id}" onchange="toggleMetric(${m.id})">
                <div class="m-info">
                    <div class="m-name">${m.name}</div>
                    <div class="m-meta">${m.code} | ${m.metric_type === 'quantitative' ? '量化' : '非量化'} | 默认权重 ${m.weight}%</div>
                </div>
                <div class="m-weight">
                    <input type="number" class="form-input" id="mw_${m.id}" value="${m.weight}" min="1" max="100" placeholder="权重%" oninput="updateWeight(${m.id})">
                </div>
            </div>`).join('');
    }

    function toggleMetric(id) {
        const cb = document.getElementById('mcb_' + id);
        if (cb.checked) {
            if (!selectedMetrics.find(m => m.metric_id === id)) {
                const m = allMetrics.find(m => m.id === id);
                selectedMetrics.push({ metric_id: id, weight: m.weight, order: selectedMetrics.length + 1 });
            }
        } else {
            selectedMetrics = selectedMetrics.filter(m => m.metric_id !== id);
        }
        updateWeightSum();
    }

    function updateWeight(id) {
        const val = parseFloat(document.getElementById('mw_' + id).value) || 0;
        const sm = selectedMetrics.find(m => m.metric_id === id);
        if (sm) sm.weight = val;
        updateWeightSum();
    }

    function updateWeightSum() {
        const sum = selectedMetrics.reduce((s, m) => s + (m.weight || 0), 0);
        const el = document.getElementById('weightSum');
        el.textContent = sum + '%';
        el.style.color = sum === 100 ? 'var(--success)' : 'var(--error)';
    }

    function renderTemplates(templates) {
        if (!templates.length) {
            document.getElementById('templateList').innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><p>暂无考核模板</p></div>';
            return;
        }
        const user = getUser();
        const isAdmin = user && user.role === 'admin';
        document.getElementById('templateList').innerHTML = `
            <div class="template-list">
                ${templates.map(t => {
                    const total = t.metrics.reduce((s, m) => s + (m.weight || 0), 0);
                    return `<div class="template-card">
                        <div class="tpl-header">
                            <span class="tpl-name">${t.name}</span>
                            <span class="badge ${t.is_active ? 'badge-active' : 'badge-inactive'}">${t.is_active ? '启用' : '停用'}</span>
                        </div>
                        <div class="tpl-desc">${t.description || ''}</div>
                        <div class="metric-tags">${(t.metrics||[]).slice(0, 5).map(m => 
                            `<span class="metric-tag"><strong>${m.metric ? m.metric.name : '指标' + m.metric_id}</strong> ${m.weight}%</span>`
                        ).join('')}</div>
                        <div class="weight-total">权重合计：<strong>${total}%</strong> ${t.position_type ? '| 适用：' + t.position_type : ''}</div>
                        ${isAdmin ? `<div class="actions">
                            <button class="btn-edit" onclick="editTemplate(${t.id})">编辑</button>
                            <button class="btn-delete" onclick="deleteTemplate(${t.id})">删除</button>
                        </div>` : ''}
                    </div>`;
                }).join('')}
            </div>`;
    }

    function openAdd() {
        editingId = null;
        selectedMetrics = [];
        document.getElementById('modalTitle').textContent = '新建考核模板';
        document.getElementById('tplForm').reset();
        document.getElementById('tplId').value = '';
        loadMetricsForPicker();
        updateWeightSum();
        document.getElementById('tplModal').classList.add('show');
    }

    async function editTemplate(id) {
        editingId = id;
        document.getElementById('modalTitle').textContent = '编辑考核模板';
        try {
            const data = await api('/appraisal/templates/' + id);
            const t = data.data;
            document.getElementById('tplId').value = t.id;
            document.getElementById('tName').value = t.name || '';
            document.getElementById('tPosition').value = t.position_type || '通用';
            document.getElementById('tDesc').value = t.description || '';
            await loadMetricsForPicker();
            // Restore selected
            selectedMetrics = (t.metrics||[]).map((m, i) => {
                const cb = document.getElementById('mcb_' + m.metric_id);
                if (cb) cb.checked = true;
                const wEl = document.getElementById('mw_' + m.metric_id);
                if (wEl) wEl.value = m.weight;
                return { metric_id: m.metric_id, weight: m.weight, order: i + 1 };
            });
            updateWeightSum();
        } catch (err) { toast(err.message, 'error'); }
        document.getElementById('tplModal').classList.add('show');
    }

    function closeModal() { document.getElementById('tplModal').classList.remove('show'); editingId = null; selectedMetrics = []; }

    async function submitTemplate() {
        const name = document.getElementById('tName').value.trim();
        if (!name) { toast('模板名称不能为空', 'error'); return; }
        const sum = selectedMetrics.reduce((s, m) => s + (m.weight || 0), 0);
        if (sum !== 100) { toast('权重合计必须等于100%（当前' + sum + '%）', 'error'); return; }
        const form = {
            name,
            position_type: document.getElementById('tPosition').value,
            description: document.getElementById('tDesc').value.trim(),
            metrics: selectedMetrics,
            is_active: true,
        };
        try {
            if (editingId) { await api('/appraisal/templates/' + editingId, {method:'PUT', body:JSON.stringify(form)}); toast('更新成功', 'success'); }
            else { await api('/appraisal/templates', {method:'POST', body:JSON.stringify(form)}); toast('创建成功', 'success'); }
            closeModal();
            loadTemplates();
        } catch (err) { toast(err.message, 'error'); }
    }

    async function deleteTemplate(id) {
        if (!confirm('确定删除该模板？')) return;
        try { await api('/appraisal/templates/' + id, {method:'DELETE'}); toast('删除成功', 'success'); loadTemplates(); }
        catch (err) { toast(err.message, 'error'); }
    }

    initNav();
    loadTemplates();
    </script>
</body>
</html>
