<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工管理 - 绿林工具绩效管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --brand: #0078D4; --brand-hover: #106EBE;
            --text-primary: #323130; --text-secondary: #605E5C;
            --bg-primary: #FFFFFF; --bg-secondary: #F3F2F1;
            --bg-tertiary: #FAFAFA; --border: #EDEBE9; --border-strong: #D2D0CE;
            --success: #107C10; --warning: #FF8C00; --error: #D13438;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.1);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
        }
        body { font-family: "Segoe UI Variable","Segoe UI","Microsoft YaHei",sans-serif; font-size: 16px; line-height: 1.6; color: var(--text-primary); background: var(--bg-secondary); }
    </style>
    <link rel="stylesheet" href="/components.html">
    <style>
        .page-wrapper { margin-top: 60px; padding: 32px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: white; border-radius: 8px; padding: 20px; box-shadow: var(--shadow-sm); }
        .stat-card .stat-label { font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; }
        .stat-card .stat-value { font-size: 28px; font-weight: 700; color: var(--text-primary); }
        .stat-card .stat-value.blue { color: var(--brand); }
        .stat-card .stat-value.green { color: var(--success); }
        .stat-card .stat-value.orange { color: var(--warning); }
        .filter-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
        .filter-group { display: flex; flex-direction: column; gap: 4px; }
        .filter-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
        .filter-input, .filter-select { padding: 7px 12px; border: 1px solid var(--border-strong); border-radius: 4px; font-size: 14px; font-family: inherit; }
        .filter-input:focus, .filter-select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(0,120,212,0.15); }
        table { width: 100%; border-collapse: collapse; font-size: 14px; background: white; border-radius: 8px; overflow: hidden; box-shadow: var(--shadow-sm); }
        table th { background: var(--bg-tertiary); padding: 12px 16px; text-align: left; font-weight: 600; color: var(--text-primary); border-bottom: 1px solid var(--border); }
        table td { padding: 12px 16px; border-bottom: 1px solid var(--border); }
        table tr:hover td { background: #F5F9FD; }
        .actions { display: flex; gap: 8px; }
        .btn { padding: 6px 16px; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; font-family: inherit; }
        .btn:active { transform: scale(0.98); }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .btn-primary { background: var(--brand); color: white; }
        .btn-primary:hover { background: var(--brand-hover); }
        .btn-secondary { background: white; color: var(--text-primary); border: 1px solid var(--border-strong); }
        .btn-secondary:hover { background: var(--bg-secondary); }
        .btn-edit { background: #DEECF9; color: var(--brand); }
        .btn-edit:hover { background: #C4DEF6; }
        .btn-delete { background: #FDE7E9; color: var(--error); }
        .btn-delete:hover { background: #F1B8BC; }
        .badge { padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; display: inline-block; }
        .badge-active { background: #DFF6DD; color: #107C10; }
        .badge-resigned { background: #FDE7E9; color: #D13438; }
        .badge-inactive { background: var(--bg-secondary); color: var(--text-secondary); }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .modal-overlay.show { opacity: 1; pointer-events: all; }
        .modal { background: white; border-radius: 8px; box-shadow: var(--shadow-lg); width: 560px; max-height: 80vh; overflow: auto; transform: translateY(20px); transition: transform 0.2s; }
        .modal-overlay.show .modal { transform: translateY(0); }
        .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .modal-title { font-size: 18px; font-weight: 600; }
        .modal-close { width: 32px; height: 32px; border-radius: 4px; border: none; background: transparent; cursor: pointer; font-size: 20px; color: var(--text-secondary); }
        .modal-body { padding: 24px; }
        .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
        .form-input, .form-select { width: 100%; padding: 8px 12px; border: 1px solid var(--border-strong); border-radius: 4px; font-size: 14px; font-family: inherit; }
        .form-input:focus, .form-select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(0,120,212,0.15); }
        .pagination { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; font-size: 14px; color: var(--text-secondary); }
        .pagination button { padding: 6px 12px; border: 1px solid var(--border); background: white; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .pagination button:hover { background: var(--bg-secondary); }
        .pagination button.active { background: var(--brand); color: white; border-color: var(--brand); }
        .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
        .empty-state { text-align: center; padding: 48px; color: var(--text-secondary); background: white; border-radius: 8px; box-shadow: var(--shadow-sm); }
        .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.3; }
        .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; z-index: 9999; box-shadow: var(--shadow-md); animation: slideIn 0.3s ease; }
        .toast-success { background: #DFF6DD; color: #0B5C0B; border: 1px solid #A7F0BA; }
        .toast-error { background: #FDE7E9; color: #A80000; border: 1px solid #FDB8BA; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>
    <script>var head = document.head; var link = document.createElement('link'); link.rel = 'stylesheet'; link.href = '/components.html'; head.appendChild(link);</script>

    <nav class="top-nav" style="height:60px;background:#fff;border-bottom:1px solid #EDEBE9;display:flex;align-items:center;padding:0 32px;position:fixed;top:0;left:0;right:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.06);">
        <a href="/dashboard.html" class="logo" style="display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;color:var(--brand);text-decoration:none;">
            <div style="width:32px;height:32px;background:linear-gradient(135deg,#107C10,#389146);border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:18px;">🌲</div>
            <span>绿林工具绩效管理系统</span>
        </a>
        <ul class="nav-menu" style="display:flex;align-items:center;gap:4px;margin-left:48px;list-style:none;" id="navMenu"></ul>
        <div class="nav-right" style="margin-left:auto;display:flex;align-items:center;gap:12px;" id="navRight"></div>
    </nav>

    <div class="page-wrapper" style="margin-top:60px;padding:32px;background:#F3F2F1;min-height:100vh;">
        <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
            <h1 style="font-size:28px;font-weight:600;color:var(--text-primary);">员工管理</h1>
            <button class="btn btn-primary" onclick="openAddModal()" id="addBtn">+ 新增员工</button>
        </div>

        <div class="stats-grid" id="statsGrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;"></div>

        <div class="card" style="background:white;border-radius:8px;box-shadow:var(--shadow-sm);padding:20px;">
            <div class="filter-row" style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;">
                <div class="filter-group">
                    <label class="filter-label">姓名/工号</label>
                    <input type="text" class="filter-input" id="searchKeyword" placeholder="搜索姓名或工号" oninput="loadEmployees(1)">
                </div>
                <div class="filter-group">
                    <label class="filter-label">部门</label>
                    <select class="filter-select" id="filterDept" onchange="loadEmployees(1)"></select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">状态</label>
                    <select class="filter-select" id="filterStatus" onchange="loadEmployees(1)">
                        <option value="">全部</option>
                        <option value="active">在职</option>
                        <option value="inactive">停用</option>
                        <option value="resigned">离职</option>
                    </select>
                </div>
                <button class="btn btn-secondary" onclick="loadEmployees(1)">搜索</button>
                <button class="btn btn-secondary" onclick="resetFilter()">重置</button>
            </div>

            <div id="tableContainer"></div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <!-- 新增/编辑模态框 -->
    <div class="modal-overlay" id="empModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">新增员工</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="empForm">
                    <input type="hidden" id="empId">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">工号 <span style="color:red">*</span></label>
                            <input type="text" class="form-input" id="empNo" required placeholder="如: EMP007">
                        </div>
                        <div class="form-group">
                            <label class="form-label">姓名 <span style="color:red">*</span></label>
                            <input type="text" class="form-input" id="empName" required placeholder="员工姓名">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">部门</label>
                            <select class="form-select" id="empDept"></select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">职位</label>
                            <input type="text" class="form-input" id="empPosition" placeholder="如: 销售经理">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">上级</label>
                            <select class="form-select" id="empManager"></select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">状态</label>
                            <select class="form-select" id="empStatus">
                                <option value="active">在职</option>
                                <option value="inactive">停用</option>
                                <option value="resigned">离职</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">手机</label>
                            <input type="text" class="form-input" id="empPhone" placeholder="138xxxxxxx">
                        </div>
                        <div class="form-group">
                            <label class="form-label">邮箱</label>
                            <input type="email" class="form-input" id="empEmail" placeholder="xxx@greener.com">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">入职日期</label>
                            <input type="date" class="form-input" id="empJoinDate">
                        </div>
                        <div class="form-group">
                            <label class="form-label">性别</label>
                            <select class="form-select" id="empGender">
                                <option value="">请选择</option>
                                <option value="男">男</option>
                                <option value="女">女</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="submitEmployee()">保存</button>
            </div>
        </div>
    </div>

    <script>
    const API = '/api';
    let currentPage = 1;
    let editingId = null;
    let departments = [];
    let employees = [];

    // Auth check
    function getToken() { return localStorage.getItem('pbc_token') || ''; }
    function getUser() { const u = localStorage.getItem('pbc_user'); return u ? JSON.parse(u) : null; }
    
    async function api(url, options = {}) {
        const headers = { 'Content-Type': 'application/json' };
        const token = getToken();
        if (token) headers['Authorization'] = 'Bearer ' + token;
        const res = await fetch(API + url, { ...options, headers: { ...headers, ...options.headers } });
        const data = await res.json();
        if (!res.ok || !data.success) {
            if (res.status === 401) { localStorage.removeItem('pbc_token'); location.href = '/login.html'; }
            throw new Error(data.message || '请求失败');
        }
        return data;
    }

    function toast(msg, type = 'info') {
        const t = document.createElement('div');
        t.className = 'toast toast-' + type;
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    function logout() {
        localStorage.removeItem('pbc_token');
        localStorage.removeItem('pbc_user');
        location.href = '/login.html';
    }

    function initNav() {
        const user = getUser();
        if (!user) { location.href = '/login.html'; return; }
        const roleLabel = { admin: '管理员', manager: '部门经理', employee: '员工' };
        const roleMenus = {
            admin: [
                { label: '工作台', url: '/dashboard.html' },
                { label: '员工管理', url: '/employees.html' },
                { label: '业务指标', url: '/metrics.html' },
                { label: '数据录入', url: '/data-entry.html' },
                { label: '考核模板', url: '/appraisal-template.html' },
                { label: '考核周期', url: '/appraisal-cycle.html' },
                { label: '考核管理', url: '/appraisal-list.html' },
                { label: '报表中心', url: '/reports.html' },
            ],
            manager: [
                { label: '工作台', url: '/dashboard.html' },
                { label: '员工管理', url: '/employees.html' },
                { label: '数据录入', url: '/data-entry.html' },
                { label: '考核管理', url: '/appraisal-list.html' },
            ],
            employee: [
                { label: '工作台', url: '/dashboard.html' },
                { label: '我的考核', url: '/appraisal-list.html' },
            ]
        };
        const menus = roleMenus[user.role] || roleMenus.employee;
        document.getElementById('navMenu').innerHTML = menus.map(m =>
            `<li><a href="${m.url}" style="padding:6px 14px;border-radius:4px;font-size:14px;color:var(--text-secondary);text-decoration:none;transition:all 0.2s;cursor:pointer;">${m.label}</a></li>`
        ).join('');
        document.getElementById('navRight').innerHTML = `
            <div class="user-info" onclick="logout()" style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 10px;border-radius:4px;">
                <div style="width:32px;height:32px;border-radius:50%;background:var(--brand);color:white;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;">${(user.username||'U')[0].toUpperCase()}</div>
                <div><div style="font-size:14px;color:var(--text-primary);">${user.username}</div><div style="font-size:12px;color:var(--text-secondary);">${roleLabel[user.role]||user.role}</div></div>
            </div>`;
        
        // 只有admin可以新增
        document.getElementById('addBtn').style.display = user.role === 'admin' ? '' : 'none';
    }

    async function loadDepartments() {
        try {
            const data = await api('/employee/departments');
            departments = data.data || [];
            const opts = departments.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
            document.getElementById('filterDept').innerHTML = '<option value="">全部部门</option>' + opts;
            document.getElementById('empDept').innerHTML = '<option value="">请选择</option>' + opts;
        } catch (e) { console.error(e); }
    }

    async function loadEmployees(page = 1) {
        currentPage = page;
        try {
            const keyword = document.getElementById('searchKeyword').value;
            const deptId = document.getElementById('filterDept').value;
            const status = document.getElementById('filterStatus').value;
            const params = new URLSearchParams({ page, page_size: 20 });
            if (keyword) params.append('keyword', keyword);
            if (deptId) params.append('department_id', deptId);
            if (status) params.append('status', status);
            
            const data = await api('/employee/list?' + params.toString());
            employees = data.data.items || [];
            renderTable(employees);
            renderPagination(data.data);
            renderStats();
        } catch (e) {
            toast('加载失败: ' + e.message, 'error');
        }
    }

    function renderStats() {
        const total = employees.length;
        const active = employees.filter(e => e.status === 'active').length;
        const inactive = employees.filter(e => e.status === 'inactive').length;
        const resigned = employees.filter(e => e.status === 'resigned').length;
        document.getElementById('statsGrid').innerHTML = `
            <div class="stat-card" style="background:white;border-radius:8px;padding:20px;box-shadow:var(--shadow-sm);">
                <div style="font-size:14px;color:var(--text-secondary);margin-bottom:8px;">员工总数</div>
                <div style="font-size:28px;font-weight:700;color:var(--brand);">${total}</div>
            </div>
            <div class="stat-card">
                <div style="font-size:14px;color:var(--text-secondary);margin-bottom:8px;">在职</div>
                <div style="font-size:28px;font-weight:700;color:var(--success);">${active}</div>
            </div>
            <div class="stat-card">
                <div style="font-size:14px;color:var(--text-secondary);margin-bottom:8px;">停用</div>
                <div style="font-size:28px;font-weight:700;color:var(--warning);">${inactive}</div>
            </div>
            <div class="stat-card">
                <div style="font-size:14px;color:var(--text-secondary);margin-bottom:8px;">离职</div>
                <div style="font-size:28px;font-weight:700;color:var(--error);">${resigned}</div>
            </div>`;
    }

    function renderTable(emps) {
        if (!emps || emps.length === 0) {
            document.getElementById('tableContainer').innerHTML = `
                <div class="empty-state" style="text-align:center;padding:48px;color:var(--text-secondary);">
                    <div style="font-size:48px;margin-bottom:12px;opacity:0.3;">👤</div>
                    <p>暂无员工数据</p>
                </div>`;
            return;
        }
        document.getElementById('tableContainer').innerHTML = `
            <table>
                <thead><tr>
                    <th>工号</th><th>姓名</th><th>部门</th><th>职位</th>
                    <th>上级</th><th>入职日期</th><th>状态</th>
                    <th id="thActions" style="text-align:right;">操作</th>
                </tr></thead>
                <tbody>${emps.map(e => `
                    <tr>
                        <td><code style="background:#F3F2F1;padding:2px 6px;border-radius:4px;font-size:12px;">${e.employee_no||''}</code></td>
                        <td><strong>${e.name||''}</strong></td>
                        <td>${e.department ? e.department.name : '-'}</td>
                        <td>${e.position||'-'}</td>
                        <td>${e.manager||'<span style="color:var(--text-secondary)">-</span>'}</td>
                        <td>${e.join_date||''}</td>
                        <td><span class="badge badge-${e.status==='active'?'active':e.status==='resigned'?'resigned':'inactive'}">${e.status==='active'?'在职':e.status==='resigned'?'离职':'停用'}</span></td>
                        <td class="actions" style="text-align:right;">
                            <button class="btn btn-sm btn-edit" onclick="editEmployee(${e.id})">编辑</button>
                            <button class="btn btn-sm btn-delete" onclick="deleteEmployee(${e.id})">删除</button>
                        </td>
                    </tr>`).join('')}</tbody>
            </table>`;
        
        // 非admin隐藏操作列
        const user = getUser();
        if (user && user.role !== 'admin') {
            document.getElementById('thActions').style.display = 'none';
            document.querySelectorAll('.actions').forEach(el => el.style.display = 'none');
        }
    }

    function renderPagination(pg) {
        if (!pg || pg.pages <= 1) {
            document.getElementById('pagination').innerHTML = '';
            return;
        }
        let btns = `<button ${pg.page <= 1 ? 'disabled' : ''} onclick="loadEmployees(${pg.page-1})">上一页</button>`;
        for (let i = 1; i <= pg.pages; i++) {
            if (i === 1 || i === pg.pages || Math.abs(i - pg.page) <= 2) {
                btns += `<button class="${i === pg.page ? 'active' : ''}" onclick="loadEmployees(${i})">${i}</button>`;
            } else if (i === 2 || i === pg.pages - 1) {
                btns += `<span style="padding:0 4px;">...</span>`;
            }
        }
        btns += `<button ${pg.page >= pg.pages ? 'disabled' : ''} onclick="loadEmployees(${pg.page+1})">下一页</button>`;
        document.getElementById('pagination').innerHTML = `<span>共 ${pg.total} 条</span>` + btns;
    }

    async function loadEmployeeOptions() {
        try {
            const data = await api('/employee/list?page_size=100&status=active');
            const opts = (data.data.items || []).map(e => `<option value="${e.id}">${e.name}</option>`).join('');
            document.getElementById('empManager').innerHTML = '<option value="">无上级</option>' + opts;
        } catch (e) {}
    }

    function openAddModal() {
        editingId = null;
        document.getElementById('modalTitle').textContent = '新增员工';
        document.getElementById('empForm').reset();
        document.getElementById('empId').value = '';
        document.getElementById('empModal').classList.add('show');
        loadEmployeeOptions();
    }

    async function editEmployee(id) {
        editingId = id;
        document.getElementById('modalTitle').textContent = '编辑员工';
        try {
            const data = await api('/employee/' + id);
            const e = data.data;
            document.getElementById('empId').value = e.id;
            document.getElementById('empNo').value = e.employee_no || '';
            document.getElementById('empName').value = e.name || '';
            document.getElementById('empDept').value = e.department_id || '';
            document.getElementById('empPosition').value = e.position || '';
            document.getElementById('empStatus').value = e.status || 'active';
            document.getElementById('empPhone').value = e.phone || '';
            document.getElementById('empEmail').value = e.email || '';
            document.getElementById('empJoinDate').value = e.join_date || '';
            document.getElementById('empGender').value = e.gender || '';
            await loadEmployeeOptions();
            document.getElementById('empManager').value = e.manager_id || '';
        } catch (err) {
            toast('加载失败: ' + err.message, 'error');
        }
        document.getElementById('empModal').classList.add('show');
    }

    function closeModal() {
        document.getElementById('empModal').classList.remove('show');
        editingId = null;
    }

    async function submitEmployee() {
        const form = {
            employee_no: document.getElementById('empNo').value.trim(),
            name: document.getElementById('empName').value.trim(),
            department_id: document.getElementById('empDept').value || null,
            position: document.getElementById('empPosition').value.trim(),
            manager_id: document.getElementById('empManager').value || null,
            status: document.getElementById('empStatus').value,
            phone: document.getElementById('empPhone').value.trim(),
            email: document.getElementById('empEmail').value.trim(),
            join_date: document.getElementById('empJoinDate').value,
            gender: document.getElementById('empGender').value,
        };
        
        if (!form.employee_no || !form.name) {
            toast('工号和姓名不能为空', 'error');
            return;
        }
        
        try {
            if (editingId) {
                await api('/employee/' + editingId, { method: 'PUT', body: JSON.stringify(form) });
                toast('员工更新成功', 'success');
            } else {
                await api('/employee', { method: 'POST', body: JSON.stringify(form) });
                toast('员工创建成功', 'success');
            }
            closeModal();
            loadEmployees(currentPage);
        } catch (err) {
            toast(err.message, 'error');
        }
    }

    async function deleteEmployee(id) {
        if (!confirm('确定要删除该员工吗？')) return;
        try {
            await api('/employee/' + id, { method: 'DELETE' });
            toast('删除成功', 'success');
            loadEmployees(currentPage);
        } catch (err) {
            toast(err.message, 'error');
        }
    }

    function resetFilter() {
        document.getElementById('searchKeyword').value = '';
        document.getElementById('filterDept').value = '';
        document.getElementById('filterStatus').value = 'active';
        loadEmployees(1);
    }

    // Init
    initNav();
    loadDepartments();
    loadEmployees(1);
    </script>
</body>
</html>
