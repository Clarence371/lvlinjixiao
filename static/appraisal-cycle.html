<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考核周期 - 绿林工具绩效管理系统</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--brand:#0078D4;--brand-hover:#106EBE;--text-primary:#323130;--text-secondary:#605E5C;--bg-primary:#FFFFFF;--bg-secondary:#F3F2F1;--bg-tertiary:#FAFAFA;--border:#EDEBE9;--border-strong:#D2D0CE;--success:#107C10;--warning:#FF8C00;--error:#D13438;--shadow-sm:0 2px 4px rgba(0,0,0,0.08);--shadow-md:0 4px 12px rgba(0,0,0,0.1);}
        body{font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.6;color:var(--text-primary);background:var(--bg-secondary);}
        .page-wrapper{margin-top:60px;padding:32px;}
        .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
        .page-title{font-size:28px;font-weight:600;}
        .card{background:white;border-radius:8px;box-shadow:var(--shadow-sm);padding:24px;margin-bottom:16px;}
        .card-title{font-size:18px;font-weight:600;margin-bottom:16px;}
        .btn{padding:8px 20px;border-radius:4px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all 0.2s;font-family:inherit;}
        .btn:active{transform:scale(0.98)}
        .btn-primary{background:var(--brand);color:white}.btn-primary:hover{background:var(--brand-hover)}
        .btn-secondary{background:white;color:var(--text-primary);border:1px solid var(--border-strong)}.btn-secondary:hover{background:var(--bg-secondary)}
        .btn-sm{padding:4px 10px;font-size:12px}
        .btn-edit{background:#DEECF9;color:var(--brand);border:none;cursor:pointer;border-radius:4px;}
        .btn-delete{background:#FDE7E9;color:var(--error);border:none;cursor:pointer;border-radius:4px;}
        .btn-success{background:var(--success);color:white}
        .cycle-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;}
        .cycle-card{background:white;border-radius:8px;padding:20px;border:2px solid var(--border);transition:all 0.2s;position:relative;}
        .cycle-card.active{border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,120,212,0.15)}
        .cycle-card .cycle-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
        .cycle-card .cycle-name{font-size:18px;font-weight:600}
        .cycle-card .cycle-meta{font-size:13px;color:var(--text-secondary);margin-bottom:8px;}
        .cycle-card .cycle-dates{font-size:13px;color:var(--text-secondary);margin-bottom:12px;padding:8px;background:var(--bg-tertiary);border-radius:6px;}
        .cycle-card .phase{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
        .cycle-card .phase-item{font-size:12px;padding:3px 10px;border-radius:12px;background:var(--bg-secondary);color:var(--text-secondary)}
        .cycle-card .phase-item.done{background:#DFF6DD;color:var(--success)}
        .cycle-card .actions{display:flex;gap:8px;justify-content:flex-end}
        .badge{padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;display:inline-block;}
        .badge-draft{background:var(--bg-secondary);color:var(--text-secondary)}
        .badge-active{background:#DEECF9;color:#0078D4}
        .badge-completed{background:#DFF6DD;color:#107C10}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity 0.2s;}
        .modal-overlay.show{opacity:1;pointer-events:all}
        .modal{background:white;border-radius:8px;box-shadow:var(--shadow-md);width:560px;max-height:85vh;overflow:auto;transform:translateY(20px);transition:transform 0.2s;}
        .modal-overlay.show .modal{transform:translateY(0)}
        .modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
        .modal-title{font-size:18px;font-weight:600}
        .modal-close{width:32px;height:32px;border-radius:4px;border:none;background:transparent;cursor:pointer;font-size:20px;color:var(--text-secondary);}
        .modal-body{padding:24px}
        .modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
        .form-group{margin-bottom:16px;}
        .form-label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;}
        .form-input,.form-select{width:100%;padding:8px 12px;border:1px solid var(--border-strong);border-radius:4px;font-size:14px;font-family:inherit;}
        .form-input:focus,.form-select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,120,212,0.15);}
        .toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:500;z-index:9999;box-shadow:var(--shadow-md);animation:slideIn 0.3s ease}
        .toast-success{background:#DFF6DD;color:#0B5C0B}
        .toast-error{background:#FDE7E9;color:#A80000}
        @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
        .top-nav{height:60px;background:#fff;border-bottom:1px solid #EDEBE9;display:flex;align-items:center;padding:0 32px;position:fixed;top:0;left:0;right:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
        .logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;color:var(--brand);text-decoration:none;}
        .logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#107C10,#389146);border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:18px;}
        .nav-menu{display:flex;align-items:center;gap:4px;margin-left:48px;list-style:none;}
        .nav-menu li a{padding:6px 14px;border-radius:4px;font-size:14px;color:var(--text-secondary);text-decoration:none;transition:all 0.2s;cursor:pointer;display:block;}
        .nav-menu li a:hover{background:var(--bg-secondary)}
        .nav-right{margin-left:auto;}
        .user-avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);color:white;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;cursor:pointer;}
        .empty-state{text-align:center;padding:48px;color:var(--text-secondary);}
        .empty-icon{font-size:48px;opacity:0.3;margin-bottom:12px;}
    </style>
</head>
<body>
    <nav class="top-nav">
        <a href="/dashboard.html" class="logo"><div class="logo-icon">🌲</div><span>绿林工具绩效管理系统</span></a>
        <ul class="nav-menu" id="navMenu"></ul>
        <div class="nav-right" id="navRight"></div>
    </nav>

    <div class="page-wrapper">
        <div class="page-header">
            <h1 class="page-title">考核周期</h1>
            <button class="btn btn-primary" onclick="openAdd()" id="addBtn">+ 新建周期</button>
        </div>
        <div id="cycleList"></div>
    </div>

    <div class="modal-overlay" id="cycleModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">新建考核周期</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="cycleForm">
                    <input type="hidden" id="cycleId">
                    <div class="form-group">
                        <label class="form-label">周期名称 <span style="color:red">*</span></label>
                        <input type="text" class="form-input" id="cName" required placeholder="如: 2026年Q3绩效考核">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">年份 <span style="color:red">*</span></label>
                            <input type="number" class="form-input" id="cYear" required min="2020" max="2030" value="2026">
                        </div>
                        <div class="form-group">
                            <label class="form-label">季度</label>
                            <select class="form-select" id="cQuarter">
                                <option value="">全年</option>
                                <option value="1">Q1 (1-3月)</option>
                                <option value="2">Q2 (4-6月)</option>
                                <option value="3">Q3 (7-9月)</option>
                                <option value="4">Q4 (10-12月)</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">开始日期 <span style="color:red">*</span></label>
                            <input type="date" class="form-input" id="cStart" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">结束日期 <span style="color:red">*</span></label>
                            <input type="date" class="form-input" id="cEnd" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">自评开始</label>
                            <input type="date" class="form-input" id="cSelfStart">
                        </div>
                        <div class="form-group">
                            <label class="form-label">自评结束</label>
                            <input type="date" class="form-input" id="cSelfEnd">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">上级评分开始</label>
                            <input type="date" class="form-input" id="cMgrStart">
                        </div>
                        <div class="form-group">
                            <label class="form-label">上级评分结束</label>
                            <input type="date" class="form-input" id="cMgrEnd">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">状态</label>
                        <select class="form-select" id="cStatus">
                            <option value="draft">草稿</option>
                            <option value="active">进行中</option>
                            <option value="completed">已完成</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">备注</label>
                        <textarea class="form-input" id="cRemark" rows="2" placeholder="考核说明"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="submitCycle()">保存</button>
            </div>
        </div>
    </div>

    <script>
    const API = '/api';
    let editingId = null;

    function getToken() { return localStorage.getItem('pbc_token') || ''; }
    function getUser() { const u = localStorage.getItem('pbc_user'); return u ? JSON.parse(u) : null; }

    async function api(url, opts = {}) {
        const headers = { 'Content-Type': 'application/json' };
        const token = getToken();
        if (token) headers['Authorization'] = 'Bearer ' + token;
        const res = await fetch(API + url, { ...opts, headers: { ...headers, ...opts.headers } });
        const data = await res.json();
        if (!res.ok || !data.success) {
            if (res.status === 401) location.href = '/login.html';
            throw new Error(data.message || '失败');
        }
        return data;
    }

    function toast(msg, type = 'info') {
        const t = document.createElement('div');
        t.className = 'toast toast-' + type;
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    function logout() { localStorage.removeItem('pbc_token'); localStorage.removeItem('pbc_user'); location.href = '/login.html'; }

    function initNav() {
        const user = getUser();
        if (!user) { location.href = '/login.html'; return; }
        const menus = {
            admin: [{label:'工作台',url:'/dashboard.html'},{label:'员工管理',url:'/employees.html'},{label:'业务指标',url:'/metrics.html'},{label:'数据录入',url:'/data-entry.html'},{label:'考核模板',url:'/appraisal-template.html'},{label:'考核周期',url:'/appraisal-cycle.html'},{label:'考核管理',url:'/appraisal-list.html'},{label:'报表中心',url:'/reports.html'}],
            manager: [{label:'工作台',url:'/dashboard.html'},{label:'员工管理',url:'/employees.html'},{label:'数据录入',url:'/data-entry.html'},{label:'考核管理',url:'/appraisal-list.html'}],
            employee: [{label:'工作台',url:'/dashboard.html'},{label:'我的考核',url:'/appraisal-list.html'}]
        };
        document.getElementById('navMenu').innerHTML = (menus[user.role]||[]).map(m => `<li><a href="${m.url}">${m.label}</a></li>`).join('');
        document.getElementById('navRight').innerHTML = `<div class="user-avatar" onclick="logout()">${(user.username||'U')[0].toUpperCase()}</div>`;
        document.getElementById('addBtn').style.display = user.role === 'admin' ? '' : 'none';
    }

    async function loadCycles() {
        try {
            const data = await api('/appraisal/cycles');
            renderCycles(data.data || []);
        } catch (e) { toast('加载失败', 'error'); }
    }

    function formatDate(s) {
        if (!s) return '-';
        return new Date(s).toLocaleDateString('zh-CN', {month:'2-digit',day:'2-digit'});
    }

    function renderCycles(cycles) {
        if (!cycles.length) {
            document.getElementById('cycleList').innerHTML = '<div class="empty-state"><div class="empty-icon">📅</div><p>暂无考核周期</p></div>';
            return;
        }
        const user = getUser();
        const isAdmin = user && user.role === 'admin';
        document.getElementById('cycleList').innerHTML = `
            <div class="cycle-list">
                ${cycles.map(c => {
                    const statusBadge = {draft:'badge-draft',active:'badge-active',completed:'badge-completed'}[c.status] || 'badge-draft';
                    const statusLabel = {draft:'草稿',active:'进行中',completed:'已完成'}[c.status] || c.status;
                    const isActive = c.status === 'active';
                    return `<div class="cycle-card ${isActive ? 'active' : ''}">
                        <div class="cycle-header">
                            <span class="cycle-name">${c.name}</span>
                            <span class="badge ${statusBadge}">${statusLabel}</span>
                        </div>
                        <div class="cycle-meta">${c.year}年${c.quarter ? '第'+c.quarter+'季度' : '全年'} &nbsp;|&nbsp; ${c.remark || ''}</div>
                        <div class="cycle-dates">
                            考核周期：${formatDate(c.start_date)} ~ ${formatDate(c.end_date)}
                        </div>
                        <div class="phase">
                            <span class="phase-item">自评: ${formatDate(c.self_review_start)} ~ ${formatDate(c.self_review_end)}</span>
                            <span class="phase-item">上级评分: ${formatDate(c.manager_review_start)} ~ ${formatDate(c.manager_review_end)}</span>
                        </div>
                        ${isAdmin ? `<div class="actions">
                            <button class="btn btn-sm btn-edit" onclick="editCycle(${c.id})">编辑</button>
                            <button class="btn btn-sm btn-delete" onclick="deleteCycle(${c.id})">删除</button>
                        </div>` : ''}
                    </div>`;
                }).join('')}
            </div>`;
    }

    function openAdd() {
        editingId = null;
        document.getElementById('modalTitle').textContent = '新建考核周期';
        document.getElementById('cycleForm').reset();
        document.getElementById('cycleId').value = '';
        document.getElementById('cycleModal').classList.add('show');
    }

    async function editCycle(id) {
        editingId = id;
        document.getElementById('modalTitle').textContent = '编辑考核周期';
        try {
            const data = await api('/appraisal/cycles/' + id);
            const c = data.data;
            document.getElementById('cycleId').value = c.id;
            document.getElementById('cName').value = c.name || '';
            document.getElementById('cYear').value = c.year || '';
            document.getElementById('cQuarter').value = c.quarter || '';
            document.getElementById('cStart').value = c.start_date || '';
            document.getElementById('cEnd').value = c.end_date || '';
            document.getElementById('cSelfStart').value = c.self_review_start || '';
            document.getElementById('cSelfEnd').value = c.self_review_end || '';
            document.getElementById('cMgrStart').value = c.manager_review_start || '';
            document.getElementById('cMgrEnd').value = c.manager_review_end || '';
            document.getElementById('cStatus').value = c.status || 'draft';
            document.getElementById('cRemark').value = c.remark || '';
        } catch (err) { toast(err.message, 'error'); }
        document.getElementById('cycleModal').classList.add('show');
    }

    function closeModal() { document.getElementById('cycleModal').classList.remove('show'); editingId = null; }

    async function submitCycle() {
        const form = {
            name: document.getElementById('cName').value.trim(),
            year: parseInt(document.getElementById('cYear').value),
            quarter: parseInt(document.getElementById('cQuarter').value) || null,
            start_date: document.getElementById('cStart').value,
            end_date: document.getElementById('cEnd').value,
            self_review_start: document.getElementById('cSelfStart').value || null,
            self_review_end: document.getElementById('cSelfEnd').value || null,
            manager_review_start: document.getElementById('cMgrStart').value || null,
            manager_review_end: document.getElementById('cMgrEnd').value || null,
            status: document.getElementById('cStatus').value,
            remark: document.getElementById('cRemark').value.trim(),
        };
        if (!form.name || !form.start_date || !form.end_date) { toast('名称和日期不能为空', 'error'); return; }
        try {
            if (editingId) { await api('/appraisal/cycles/' + editingId, {method:'PUT', body:JSON.stringify(form)}); toast('更新成功', 'success'); }
            else { await api('/appraisal/cycles', {method:'POST', body:JSON.stringify(form)}); toast('创建成功', 'success'); }
            closeModal();
            loadCycles();
        } catch (err) { toast(err.message, 'error'); }
    }

    async function deleteCycle(id) {
        if (!confirm('确定删除该考核周期？')) return;
        try { await api('/appraisal/cycles/' + id, {method:'DELETE'}); toast('删除成功', 'success'); loadCycles(); }
        catch (err) { toast(err.message, 'error'); }
    }

    initNav();
    loadCycles();
    </script>
</body>
</html>
