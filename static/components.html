.toast-error { background: #FDE7E9; color: #A80000; border: 1px solid #FDB8BA; }

<script>
// ========== 全局通用函数 ==========

const API_BASE = '/api';

// 获取 token
function getToken() {
    return localStorage.getItem('pbc_token') || '';
}

// 通用请求
async function request(url, options = {}) {
    const headers = { 'Content-Type': 'application/json' };
    const token = getToken();
    if (token) headers['Authorization'] = `Bearer ${token}`;
    
    const res = await fetch(API_BASE + url, {
        ...options,
        headers: { ...headers, ...options.headers }
    });
    
    const data = await res.json();
    if (!res.ok || !data.success) {
        if (res.status === 401) {
            logout();
        }
        throw new Error(data.message || '请求失败');
    }
    return data;
}

// Toast 提示
function showToast(message, type = 'info') {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.textContent = message;
    document.body.appendChild(toast);
    
    setTimeout(() => toast.remove(), 3000);
}

// 获取当前用户
function getCurrentUser() {
    const u = localStorage.getItem('pbc_user');
    return u ? JSON.parse(u) : null;
}

// 检查登录状态
function checkAuth() {
    const token = getToken();
    if (!token) {
        location.href = '/login.html';
        return null;
    }
    return getCurrentUser();
}

// 退出登录
function logout() {
    localStorage.removeItem('pbc_token');
    localStorage.removeItem('pbc_user');
    location.href = '/login.html';
}

// 渲染顶部导航（嵌入到各页面）
function renderNav(activeMenu = '') {
    const user = getCurrentUser();
    if (!user) return;
    
    const roleLabel = { admin: '管理员', manager: '部门经理', employee: '员工' };
    const initial = (user.username || 'U')[0].toUpperCase();
    
    let menus = [];
    if (user.role === 'admin') {
        menus = [
            { label: '工作台', url: '/dashboard.html', icon: '&#xe77b;' },
            { label: '员工管理', url: '/employees.html', icon: '&#xe77d;' },
            { label: '业务指标', url: '/metrics.html', icon: '&#xe9d9;' },
            { label: '数据录入', url: '/data-entry.html', icon: '&#xe70f;' },
            { label: '考核模板', url: '/appraisal-template.html', icon: '&#xe8a1;' },
            { label: '考核周期', url: '/appraisal-cycle.html', icon: '&#xe787;' },
            { label: '考核管理', url: '/appraisal-list.html', icon: '&#xe8bc;' },
            { label: '报表中心', url: '/reports.html', icon: '&#xe9f9;' },
        ];
    } else if (user.role === 'manager') {
        menus = [
            { label: '工作台', url: '/dashboard.html', icon: '&#xe77b;' },
            { label: '员工管理', url: '/employees.html', icon: '&#xe77d;' },
            { label: '数据录入', url: '/data-entry.html', icon: '&#xe70f;' },
            { label: '考核管理', url: '/appraisal-list.html', icon: '&#xe8bc;' },
            { label: '报表中心', url: '/reports.html', icon: '&#xe9f9;' },
        ];
    } else {
        menus = [
            { label: '工作台', url: '/dashboard.html', icon: '&#xe77b;' },
            { label: '我的考核', url: '/appraisal-list.html', icon: '&#xe8bc;' },
            { label: '数据录入', url: '/data-entry.html', icon: '&#xe70f;' },
        ];
    }
    
    const navHTML = `
    <nav class="top-nav">
        <a href="/dashboard.html" class="logo">
            <div class="logo-icon">&#x1F333;</div>
            <span>绿林工具绩效管理系统</span>
        </a>
        <ul class="nav-menu">
            ${menus.map(m => `
                <li><a href="${m.url}" class="${activeMenu === m.label ? 'active' : ''}">${m.label}</a></li>
            `).join('')}
        </ul>
        <div class="nav-right">
            <div class="user-info" onclick="logout()">
                <div class="user-avatar">${initial}</div>
                <div>
                    <div class="user-name">${user.username}</div>
                    <div class="user-role">${roleLabel[user.role] || user.role}</div>
                </div>
            </div>
        </div>
    </nav>`;
    
    document.write(navHTML);
}

// 格式化日期
function formatDate(str) {
    if (!str) return '-';
    const d = new Date(str);
    return d.toLocaleDateString('zh-CN');
}

// 格式化数字
function formatNumber(n, decimals = 2) {
    if (n === null || n === undefined) return '-';
    return Number(n).toFixed(decimals);
}

// 权限判断
function hasRole(roles) {
    const user = getCurrentUser();
    if (!user) return false;
    return roles.includes(user.role);
}
</script>
